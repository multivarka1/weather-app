name: iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Select an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in sorted(d["devices"].items(), reverse=True) if "iOS" in runtime for x in devices if x["name"].startswith("iPhone") and x["isAvailable"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and test
        run: xcodebuild test -project Atmos.xcodeproj -scheme Atmos -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/Atmos.app Atmos-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Atmos-simulator
          path: Atmos-simulator.zip
          if-no-files-found: error
