name: iOS device (unsigned)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Build for iPhone without signing
        run: >-
          xcodebuild build -project Atmos.xcodeproj -scheme Atmos
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned application
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release-iphoneos/Atmos.app Atmos-device-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Atmos-device-unsigned
          path: Atmos-device-unsigned.zip
          if-no-files-found: error
